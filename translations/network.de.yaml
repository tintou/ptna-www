    overpass:
        title: 'Overpass-API Abfrage'
        text: 'Für den Download der OSM-Daten wird das <a href="https://wiki.openstreetmap.org/wiki/DE:Overpass_API">Overpass-API</a> verwendet. <a href="%doc_url%#overpass">Die verwendete Abfrage</a> liefert alle Ways und Nodes der Routen (deren Member mit ihren Details) aus einem definierten <a href="%doc_url%#searcharea">Suchgebiet</a>. Die so erhaltenen Daten erlauben eine Analyse der ÖPNV-Linien dahingehend, dass z.B. auch die Wegstrecke auf Vollständigkeit geprüft werden kann. Nodes, Ways und Relationen (Stops und Platforms) und deren Tags können gegen deren Rolle ''role'' in der Relation geprüft werden.'
        size: 'Diese Abfrage liefert derzeit etwa %size% MB.'
