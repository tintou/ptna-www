        title: "Suchgebiet"
        region: "Stadt / Region"
        network: "Verkehrsverbund"
        download: "Details des Gebietes von Overpass-API laden"
        overpass_api: "Suchgebiet für Overpass-API-Anfragen"
        overpass_api_description: "Für die meisten Fällen basiert die Definition des Gebiets auf dem 'wikidata'-Tag der (administrativen) Grenzrelation(en). Die anderen Fälle werden nach und nach umgestellt."
        osmium_extract: "Suchgebiet für 'osmium extract'"
        osmium_extract_description: "Dieser etwas größere Bereich wird ausschließlich für die nächtliche Analyse von PTNA verwendet. Es definiert den Bereich, der an 'osmium extract' übergeben wird, und wird in der Regel mit dem unten genannten Tool und den dort angegebenen Einstellungen erstellt, die auf die ID der entsprechenden (administrativen) Grenzrelation(en) angewendet werden. Die Anzahl der Knoten im Polygon, das den Extraktionsbereich definiert, wird reduziert. Es gibt auch einen Puffer um den Overpass-API-Bereich herum. 'osmium' extrahiert OSM-Objekte aus diesem Bereich aus dem OSM Planet Dump, einschließlich der zugehörigen Nodes und Ways (keine Relationen) außerhalb dieses Bereichs. Anschließend wird 'osmium filter' verwendet, um die Größe des Extrakts zu reduzieren, indem irrelevante Daten (buildings, landuse, bicycle routes usw.) gelöscht werden."
        osmium_getid: "Suchgebiet für 'osmium getid'"
        osmium_getid_description: "Dieser noch größere Bereich wird verwendet, wenn PTNA fehlende Objektdaten gemeldet hat, die im 'osmium extrakt' Gebiet nicht gefunden wurden. Diese Daten betreffen Relationen außerhalb des Extraktbereichs, die Mitglieder von route_master oder route Relationen innerhalb des Bereichs sind (z. B. MP-Plattformen in Bahnhöfen). Der Bereich wird in der Regel mit dem unten aufgeführten Werkzeug und den dort angegebenen Einstellungen erstellt, die auf die ID der entsprechenden (administrativen) Grenzrelation(en) angewendet werden. Vergrößere die Ansicht, um die Größe dieses Gebietes zu sehen."
