home:
    what:
        title: 'Public Transport ... was?'
        wiki: 'Im OSM Wiki gibt es für viele Städte eine Beschreibung der dort tätigen Nahverkehrsverbünde nebst einer tabellarischen Auflistung der diversen Zug-, U-Bahn-, Tram- und Bus-Linien.'
        examples: 'Beispiele: <a href="https://wiki.openstreetmap.org/wiki/München/Transportation#Verkehrsmittel">München (MVV)</a>, <a href="https://wiki.openstreetmap.org/wiki/VRS">Verkehrsverbund Rhein-Sieg</a>, <a href="https://wiki.openstreetmap.org/wiki/DE:Aachener_Verkehrsverbund#.C3.9Cbersicht_aller_Linien_im_AVV">Aachen (AVV)</a>, <a href="https://wiki.openstreetmap.org/wiki/Berlin/Transportation">Berlin</a>, <a href="https://wiki.openstreetmap.org/wiki/Verkehrsverbund_Berlin-Brandenburg">Berlin (VBB)</a>, <a href="https://wiki.openstreetmap.org/wiki/Hamburger_Verkehrsverbund">Hamburg</a>'
        outdated: 'Es hat sich jedoch, zumindest für München, gezeigt, dass die Tabellen nie so richtig aktuell sind.'
        motivation: 'Das war für den Münchner Stammtisch <a href="%doc_url%#motivation">Motivation</a>, sich des Themas mal anzunehmen.'
        goal: 'PTNA - Public Transport Network Analysis soll helfen dieses Problem zu lösen, indem es diese Tabellen automatisiert erstellt und dabei eine <strong>Soll-Ist-Analyse</strong> durchführt.'
        target: '"Soll" = das was der <a href="%doc_url%#networkroutes">örtliche Verkehrsverbund anbietet</a> (basierend auf einer <a href="%doc_url%#routesdescription">CSV-Liste</a>, die von lokalen Mappern gepflegt wird),'
        actual: '"Ist" = das, was wir in <a href="%doc_url%#overpass">OSM gemapped</a> haben.'
        errors: 'Neben dem reinen Auflisten der Linien erfolgt auch eine Fehleranalyse der Route- und Route-Master-Relationen.'
        networks: 'Derzeit werden die OSM-Daten von <a href="%results_url%">über 100 Verkehrsverbünden</a> durch PTNA analysiert. Weitere <a href="%faq_url%#faqaddnetwork">Verkehrsverbünde hinzuzufügen</a> ist recht einfach und geht mehr oder weniger schnell.'
        documentation: 'Was noch ziemlich am Anfang steht ist die <a href="%doc_url%">Dokumentation</a>. Ich bitte daher um Geduld, das wird noch.'
