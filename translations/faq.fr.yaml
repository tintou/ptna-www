faq:
    intro: |-
        En règle générale les questions / remarques peuvent <a href="/contact.html">m'être directement</a> adressées. Je m'efforcerais d'y répondre le plus rapidement possible.<br />
        Pour les questions ou remarques d'intérêt général ou des questions plus spécifiques sur les réseaux de transports en commun veuillez consulter les paragraphes ci-dessous.<br />
    tool:
        title: 'J''ai une question / remarque pour cet outil'
        intro: |-
            Les questions ou remarques peuvent être discutées sur la <a href="https://wiki.openstreetmap.org/wiki/User_talk:ToniE/ptna">page PTNA du Wiki OSM</a>.
    othertools:
        title: 'Quid des autres outils d''assurance qualité pour les itinéraires de transports en commun dans OSM ?'
        intro: |-
            Bien entendu il existe déjà tout un tas d'outils d'assurance qualité sur le thème transports en commun.
            Certains considèrent chaque relation (itinéraire), d'autre une zone (p.ex. OSM Inspector).
            Le plugin "pt_assistant" de JOSM est à recommander, car il aide dès la création ou modification d'itinéraire de commettre des erreurs.
        items:
            i1: |-
                <strong>pt_assistant</strong> <a href="https://josm.openstreetmap.de/wiki/Plugins">Plugin de JOSM</a>
            i2: |-
                <strong>OSM Inspector</strong> a une
                <a href="https://tools.geofabrik.de/osmi/?view=pubtrans_routes&lon=11.56600&lat=48.13900&zoom=10&overlays=ptv2_routes_,ptv2_routes_valid,ptv2_routes_invalid,ptv2_error_,ptv2_error_ways,ptv2_error_nodes">analyse d'itinéraires de transports publics</a>
                et une
                <a href="https://tools.geofabrik.de/osmi/?view=pubtrans_stops&lon=11.56600&lat=48.13900&zoom=10&overlays=stops_,stops_positions,stops_classic,stops_positions_not_on_ways,platforms_,platforms_nodes,platforms_ways">analyse des arrêts de ces mêmes transports publics</a>
            i3: |-
                <a href="https://wiki.openstreetmap.org/wiki/Overpass_API/Public_transport_examples">Exemples</a> pour l'utilisation de l'<strong>API de Overpass</strong>
            i4: |-
                <a href="https://ra.osmsurround.org">OSM Relation Analyzer</a> et <a href="https://wiki.openstreetmap.org/wiki/Relation_Analyzer">documentation</a> dans le OSM
            i5: |-
                <strike>Les collègues français ont un outil pour l'<a href="https://analyser.openstreetmap.fr/cgi-bin/index.py">analyse d'itinéraires</a></strike>
            i6: |-
                Les collègues français ont aussi un autre outil pour l'<a href="https://gitlab.com/venza80/overpasspy">analyse d'itinéraires</a>
            i7: |-
                Le <a href="https://cdn.organicmaps.app/subway/index.html">Subway Validator</a> de Ilya Zverik
            i8: |-
                Voir aussi le thème <a href="https://wiki.openstreetmap.org/wiki/FR:Assurance_qualit%C3%A9">assurance qualité</a> sur le Wiki OSM
            i9: |-
                <a href="https://osmand.net">OSMAND</a> a un routage transports en commun et un bon aperçu <a href="https://osmand.net/blog/guideline-pt">comment cartographier les itinéraires</a>
    messages:
        title: 'Où puis-je trouver des explications concernant les erreurs ?'
        body: |-
            Les explications détaillées sont <a href="/fr/index.php#messages">ici</a>.
    network:
        title: 'J''ai une question / remarque pour l''interprétation d''un réseau de transports en commun particulier'
        body: |-
            Les questions / remarques pour l'interprétation d'un réseau de transports en commun particulier peuvent être discutées sur le Wiki OSM dédié.
            Vous trouverez le lien dans la ligne adéquate du <a href="/results/FR/index.php">tableau de résultat</a> dans la colonne "Configuration" puis sous "Discussion".<br />
    addnetwork:
        title: 'Comment puis-je ajouter l''analyse d''un nouveau réseau ?'
        intro: |-
            C'est relativement simple et rapide. Et bien entendu je vous aide.
            Tout ce qui est nécessaire sont quelques informations, qui seront documentées dans le Wiki OSM.
            Le Wiki OSM a cet avantage, que les modifications sont à tout moment possible, ce qui est en général nécessaire lors du changement du plan du réseau.
        items:
            i1: |-
                <strong>Comment s'appelle le réseau</strong> dans sa forme longue et courte ?<br />
                Par exemple : "Régie autonome des transports parisiens" et "RATP"
            i2: |-
                <strong>Dans quelle zone</strong> doit-être effectuée l'analyse ?<br />
                Voir : <a href="index.php#overpass">téléchargement des données OSM</a>
            i3: |-
                <strong>Une liste des itinéraires adéquates</strong><br />
                La liste peut être vide au départ<br />
                Voir : <a href="index.php#networkroutes">itinéraires appartenant au réseau</a>
                ainsi que <a href="index.php#routesdescription">description des itinéraires attendus</a><br />
                Exemple avec le réseau de la ville d'Avignon : <a href="https://wiki.openstreetmap.org/wiki/Avignon/Transports_en_commun/Lignes_Orizo">Orizo</a><br />
                <strong>Important : attention au droit de propriété intellectuelle (Copyright) &copy; du réseau concerné et de la provenance des données !</strong><br />
                <strong>Note : la liste sera publié sur le Wiki OSM avec le modèle de licence en vigueur.</strong>
            i4: |-
                <strong>Où devrait être sauvegarder les pages Wiki OSM dédiées ?</strong><br />
                Exemple : page de discussion du réseau de la ville de Munich <a href="https://wiki.openstreetmap.org/wiki/Talk:M%C3%BCnchen/Transportation/Analyse">https://wiki.openstreetmap.org/wiki/Talk:München/Transportation/Analyse</a><br />
                Exemple : Liste des lignes du réseau Orizo <a href="https://wiki.openstreetmap.org/wiki/Avignon/Transports_en_commun/Lignes_Orizo">https://wiki.openstreetmap.org/wiki/Avignon/Transports_en_commun/Lignes_Orizo</a>
        outro1: 'Les informations seront sauvegardées dans le Wiki OSM avec l''avantage indiqué plus haut.'
        outro2: |-
            Le plus simple et plus rapide est si vous créez 2 pages Wiki OSM et me communiquez ces 2 pages.
            Les 2 pages peuvent être créer à partir des modèles suivants :<br />
            Page de discussion : <a href="https://wiki.openstreetmap.org/wiki/Talk:M%C3%BCnchen/Transportation/Analyse">https://wiki.openstreetmap.org/wiki/Talk:München/Transportation/Analyse</a><br />
            Configuration des itinéraires : <a href="https://wiki.openstreetmap.org/wiki/M%C3%BCnchen/Transportation/MVV-Linien-gesamt">https://wiki.openstreetmap.org/wiki/München/Transportation/MVV-Linien-gesamt</a>
