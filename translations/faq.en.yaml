faq:
    intro: |-
        In general, comments can be <a href="%contact_url%">sent to me.</a> I usually answer quite quickly.<br />
        For questions and remarks regarding a specific 'network' please read the following sections.
    tool:
        title: 'I have general questions and remarks ...'
    othertools:
        title: 'Are there other tools on OSM which support Quality Assurance for Public Transport?'
        intro: |-
            Sure there are a lot of QA tools for OSM taking care of Public Transport. Some of them analyse a single route relation, others provide data for a region (OSM Inspector).
            I recommend the "pt_assistant" plugin of JOSM, errors can be avoided while creating or modifying a route relation.
        items:
            i1: |-
                <strong>pt_assistant</strong> <a href="https://josm.openstreetmap.de/wiki/Plugins">Plugin of JOSM</a>
            i2: |-
                <strong>OSM Inspector</strong> provides an
                <a href="https://tools.geofabrik.de/osmi/?view=pubtrans_routes&lon=11.56600&lat=48.13900&zoom=10&overlays=ptv2_routes_,ptv2_routes_valid,ptv2_routes_invalid,ptv2_error_,ptv2_error_ways,ptv2_error_nodes">Analysis of Public Transport Routes</a>
                and an
                <a href="https://tools.geofabrik.de/osmi/?view=pubtrans_stops&lon=11.56600&lat=48.13900&zoom=10&overlays=stops_,stops_positions,stops_classic,stops_positions_not_on_ways,platforms_,platforms_nodes,platforms_ways">Analysis of Public Transport Stops</a>
            i3: |-
                <a href="https://wiki.openstreetmap.org/wiki/Overpass_API/Public_transport_examples">Examples</a> belonging to <strong>Overpass API</strong>
            i4: |-
                <a href="https://ra.osmsurround.org">OSM Relation Analyzer</a> and <a href="https://wiki.openstreetmap.org/wiki/DE:Relation_Analyzer">Documentation</a> in the OSM Wiki
            i5: |-
                <strike>French colleagues provide a tool for the <a href="https://analyser.openstreetmap.fr/cgi-bin/index.py">Analysis of Route-Relations</a></strike>
            i6: |-
                French colleagues provide another tool for the <a href="https://gitlab.com/venza80/overpasspy">Analysis of Route-Relations</a>
            i7: |-
                Ilya Zveriks' <a href="https://cdn.organicmaps.app/subway/index.html">Subway Validator</a>
            i8: |-
                <a href="https://wiki.openstreetmap.org/wiki/Quality_assurance">Quality Assurance</a> in the OSM Wiki
            i9: |-
                <a href="https://osmand.net">OSMAND</a> supports routing with public transport and provides excellent <a href="https://osmand.net/blog/guideline-pt">Guidelines on how to build or correct public transport routes</a>
    messages:
        title: 'Where can I find a description of the errors and notes?'
        body: |-
            An exhaustive list of error and note messages and how to fix the problems is in preparation and will be provided in the documentation: '<a href="%doc_url%#messages">Messages</a>'.
    network:
        title: 'I have questions and remarks regarding a specific ''network'' (transport association)'
        body: |-
            For each specific transport association, there is usually a PTNA related page in the OSM-Wiki for discussions, questions and remarks.
            You can find the corresponding link in the column "Configuration" of the table on the <a href="/results/LU/index.php">result</a> (example Luxembourg) page of <a href="/results/index.html">your country</a>.
            There you can find also more information about the area of interest and the options/checks used for the analysis.<br />
            Example: Configuration page for the <a href="https://ptna.openstreetmap.de/config?network=LU-RGTR">RGTR transport association Luxembourg</a> in PTNA.<br />
            Example: Discussion page for the <a href="https://wiki.openstreetmap.org/wiki/Talk:WikiProject_Luxembourg/Public_Transport/Analysis/RGTR">RGTR transport association Luxembourg</a> in the OSM-Wiki.
    addnetwork:
        title: 'How can I add an analysis for a specific ''network'' (transport association)?'
        intro: |-
            This can be done quite easily and quickly.
            For sure, I will assist but I need some information from you.
        items:
            i1: |-
                <strong>What is the name of the transport association</strong> in long and in short form?<br />
                Examples: "Münchner Verkehrs- und Tarifverbund" and "MVV" or "Transport for London" and "TfL".
            i2: |-
                <strong>Which area</strong> is of interest?<br />
                What is the geographic region where the tool will search for the routes?<br />
                Example: The "MVV" provides services in <a href="https://overpass-turbo.eu/map.html?Q=%5Bout%3Ajson%5D%5Btimeout%3A25%5D%3B(relation%5Bboundary%3Dadministrative%5D%5Badmin_level%3D6%5D%5Bname~%27(Dachau%7CM%C3%BCnchen%7CEbersberg%7CErding%7CStarnberg%7CFreising%7CT%C3%B6lz%7CWolfratshausen%7CF%C3%BCrstenfeldbruck)%27%5D%3B)%3Bout%20body%3B%3E%3Bout%20skel%20qt%3B">several counties around Munich, Germany</a>.
            i3: |-
                <strong>A list of the PT lines operated by the transport association</strong><br />
                Which services are provided by the transport association? The bus, train, subway, ... services expected being mapped in OSM.<br />
                Example: Provided <a href="https://wiki.openstreetmap.org/wiki/WikiProject_Luxembourg/Public_Transport/Analysis/LU-RGTR-Routes">services for buses</a> by the RGTR transport association in Luxembourg.<br />
                <strong>Important: Consider the Copyright &copy; and origin of the data!</strong><br />
                <strong>Note: The list will be published in the OSM-Wiki under the OSM license.</strong>
            i4: |-
                <strong>Where do you want to store the list of PT lines in the OSM wiki?</strong><br />
                Example: Discussion page in the OSM-Wiki for the RGTR transport association in Luxembourg: <a href="https://wiki.openstreetmap.org/wiki/Talk:WikiProject_Luxembourg/Public_Transport/Analysis/RGTR">Talk:WikiProject_Luxembourg/Public_Transport/Analysis/RGTR</a>.<br />
                Example: Description of provided services: <a href="https://wiki.openstreetmap.org/wiki/WikiProject_Luxembourg/Public_Transport/Analysis/LU-RGTR-Routes">WikiProject_Luxembourg/Public_Transport/Analysis/LU-RGTR-Routes</a>.
        outro1: |-
            The information will be stored in the OSM-Wiki.
            This has the advantage that every OSM user can modify and update the data - which is required at least once a year, with the annual change of the timetables of the transport association.
        outro2: |-
            The easiest and quickest way is to provide me the data in two pages in the OSM-Wiki. You may copy&paste from the links below and choose an appropriate location in the OSM-Wiki to store your copies.<br />
            Discussion page: <a href="https://wiki.openstreetmap.org/wiki/Talk:WikiProject_Luxembourg/Public_Transport/Analysis/RGTR">https://wiki.openstreetmap.org/wiki/Talk:WikiProject_Luxembourg/Public_Transport/Analysis/RGTR</a><br />
            List of lines: <a href="https://wiki.openstreetmap.org/wiki/WikiProject_Luxembourg/Public_Transport/Analysis/LU-RGTR-Routes">https://wiki.openstreetmap.org/wiki/WikiProject_Luxembourg/Public_Transport/Analysis/LU-RGTR-Routes</a>
